name: Installer CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test:
    name: PHP ${{ matrix.php }} - Smoke & CLI Verification
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Verify Executable CLI
        run: |
          chmod +x bin/reyhan
          ./bin/reyhan --version
          ./bin/reyhan --help
          ./bin/reyhan list
